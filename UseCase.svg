@startuml
left to right direction
skinparam packageStyle rectangle

actor User as U

rectangle "Expense Tracker System" {
    usecase "Add Expense" as UE
    usecase "Delete Expense" as UD
    usecase "View Expense Details" as UV
    usecase "Edit Expense" as UEI
    usecase "Set Budget" as USB

    U - -> UE : Add Expense
    U - -> UD : Delete Expense
    U - -> UV : View Expense Details
    U - -> UEI : Edit Expense
    U - -> USB : Set Budget
}
@enduml

