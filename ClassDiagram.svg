link ExpenseTracker to Budget--><g id="link_ExpenseTracker_Budget"><path codeLine="24" d="M270.17,120.11 C290.78,151.81 316.35,191.12 336.03,221.38 " fill="none" id="ExpenseTracker-Budget" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="23" x="301" y="163.0669">has</text></g><!--MD5=[e8517987fd118399c4697c66bc0b376c]
@startuml
class Expense {
    - id: int
    - date: Date
    - payee: String
    - description: String
    - amount: float
    - modeOfPayment: String
}

class ExpenseTracker {
    - expenses: List<Expense>
    + addExpense(expense: Expense): void
    + deleteExpense(expenseId: int): void
    + getAllExpenses(): List<Expense>
}

class Budget {
    - amount: float
    + setAmount(newAmount: float): void
    + getAmount(): float
}

ExpenseTracker "1" - - "n" Expense : contains
ExpenseTracker - - Budget : has
@enduml

