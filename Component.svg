@startuml
package "Expense Tracker System" {
    [Expense Tracker GUI]
    [Expense Tracker Controller]
    [Expense Tracker Database]
    [Expense Tracker API]
}

[Expense Tracker GUI] - -> [Expense Tracker Controller]: Sends User Input
[Expense Tracker Controller] - -> [Expense Tracker Database]: Performs CRUD Operations
[Expense Tracker Controller] - -> [Expense Tracker API]: Retrieves External Data
@enduml

