@startuml
!define ENTITY(name, desc) entity name as "desc" << (E,#FF7700) >>
!define ATTRIBUTE(name, type) name : type
!define RELATIONSHIP(name, desc) entity name as "desc" << (R,#0000FF) >>
!define ISA(sub, sup) sub - -|> sup

ENTITY(User, "User") {
    ATTRIBUTE(UserID, int)
    ATTRIBUTE(Username, varchar)
    ATTRIBUTE(Password, varchar)
}

ENTITY(Expense, "Expense") {
    ATTRIBUTE(ExpenseID, int)
    ATTRIBUTE(Date, datetime)
    ATTRIBUTE(Payee, varchar)
    ATTRIBUTE(Description, varchar)
    ATTRIBUTE(Amount, float)
    ATTRIBUTE(ModeOfPayment, varchar)
}

ENTITY(Budget, "Budget") {
    ATTRIBUTE(BudgetID, int)
    ATTRIBUTE(Amount, float)
}

RELATIONSHIP(User_Expense, "Records") {
    Expense - - User
}

RELATIONSHIP(User_Budget, "Sets") {
    Budget - - User
}

RELATIONSHIP(Budget_Expense, "Allocates") {
    Budget - - Expense
}
@enduml

@startuml

entity User as "User" << (E,#FF7700) >> {
    UserID : int
    Username : varchar
    Password : varchar
}

entity Expense as "Expense" << (E,#FF7700) >> {
    ExpenseID : int
    Date : datetime
    Payee : varchar
    Description : varchar
    Amount : float
    ModeOfPayment : varchar
}

entity Budget as "Budget" << (E,#FF7700) >> {
    BudgetID : int
    Amount : float
}

entity User_Expense as "Records" << (R,#0000FF) >> {
    Expense - - User
}

entity User_Budget as "Sets" << (R,#0000FF) >> {
    Budget - - User
}

entity Budget_Expense as "Allocates" << (R,#0000FF) >> {
    Budget - - Expense
}
@enduml

