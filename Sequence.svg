,318.2266,170,322.2266,166,318.2266" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113" x="172" y="300.1606">Lists All Expenses</text><!--MD5=[ad6bb74aa39f55009254da2cc79f9a22]
@startuml
actor User
participant "Expense Tracker GUI" as GUI
participant "Expense Tracker Database" as DB

User -> GUI: Interacts with GUI
activate GUI

GUI -> DB: Sets Budget
activate DB
DB - -> GUI: Confirms Budget Update
deactivate DB

GUI -> DB: Adds Expense
activate DB
DB - -> GUI: Confirms Expense Added
deactivate DB

GUI -> GUI: Clears Fields
GUI -> GUI: Lists All Expenses

deactivate GUI
@enduml

