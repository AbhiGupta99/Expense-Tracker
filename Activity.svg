@startuml
start
:Start;

:Enter Expense Details;
if (Details Complete?) then (yes)
  :Add Expense;
  if (Budget Exceeded?) then (yes)
    :Show Error Message;
  else (no)
    :Update Budget;
    :Clear Fields;
    :List All Expenses;
    :Show Success Message;
  endif
else (no)
  :Show Error Message;
endif

stop
@enduml

